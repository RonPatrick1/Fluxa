# Fluxa is mounted under the existing patrick-lamphier.com TLS virtual host.
location = /fluxa {
    return 308 /fluxa/;
}

location = /fluxa/api/auth/login {
    limit_req zone=fluxa_login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8097/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fluxa;
    proxy_set_header X-Fluxa-Public-Proxy 1;
    proxy_set_header Connection "";
    proxy_buffering off;
    client_max_body_size 16k;
}

location /fluxa/ {
    proxy_pass http://127.0.0.1:8097/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Deliberately overwrite this value so an Internet client cannot spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fluxa;
    proxy_set_header X-Fluxa-Public-Proxy 1;
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    client_max_body_size 64k;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
